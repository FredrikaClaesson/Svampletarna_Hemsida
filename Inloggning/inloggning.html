 <!DOCTYPE html>
 <html lang="sv"> 
 <head>
     <meta charset="utf-8"/>
     <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
     <title>Inloggning | Svampletarna</title>
     <link href="../app.css" rel="stylesheet"/>
     <link href="inloggning.css" rel="stylesheet"/>
     <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet"/>
     <script src="inloggning.js" defer></script>
 </head>
 
 <body>
<!--==============================
    SIDHUVUD OCH NAVIGATION
===============================-->
     <header>
         <nav aria-label="Huvudnavigation">
             <div class="logotyp">
                 <img src="../logotyp.jpg" alt="Svampletarnas logotyp">
             </div>
                 <ul id="huvudmeny">
                     <!--aria-current="page" berättar för skärmläsare att länken är den aktuella sidan-->
                     <li><a href="../Startsida/index.html">Startsida</a></li>
                     <li><a href="../Mina_svampar/mina_svampar.html">Mina svampar</a></li>
                     <li><a href="../Information/information.html">Information</a></li>
                     <li><a href="../Bloggen/bloggen.html">Bloggen</a></li>
                     <!--aria-hidden="true" berättar för skärmläsare att ikonen ska ignoreras-->
                     <li><a href="inloggning.html" aria-current="page">
                         <i aria-hidden="true" class="fa-regular fa-user"></i>Inloggning</a></li>
                 </ul>
         </nav>
     </header>
<!--==============================
    SIDANS HUVUDINNEHÅLL
==============================--> 
 <main>
     <section class="login-intro">
         <h2>Välkommen tillbaka till skogen</h2>
         <p>Logga in för att ta del av föreningens medlemssida.</p>
     </section>
     <!-- Behållare för bild och inloggning -->
     <div class="login-container">
     <img alt="Svampar i en svensk skog" src="../images/loginbild.jpg"/>
     <!-- Sektion som innehåller inloggningsformuläret -->
     <section id="login-section">
         <h3>Logga in</h3>
         <!--Formulär för namn och lösenord-->
         <form id="login-form">
             <!--Inmatningsfält för namn-->
             <label for="username">Namn</label>
             <input id="username" name="username" required="" type="text"/>
             <label for="password">Lösenord</label>
             <input id="password" name="password" required="" type="password"/>
             <!-- Knapp som skickar det ifyllda formuläret för kontroll -->
             <button type="submit">Logga in</button>
         </form>
         <!--Felmeddelande-->
         <p id="error-message"></p>
     </section>
     <!-- Sektion som visas när användaren är inloggad, hidden gör att sektionen är dold från början -->
     <section hidden="" id="logged-in-section">
         <h2 id="welcome-message"></h2>
         <!-- Knapp för att logga ut användaren -->
         <button id="logout-button" type="button">Logga ut</button>
     </section>
     </div>
 </main>
<!--==============================
    SIDFOT 
==============================-->
 <footer>
     <p>Svampletarna – För dig som älskar skogen</p>
     <p>&copy; 2026 Svampletarna</p>
 </footer>
 </body>
 </html>
