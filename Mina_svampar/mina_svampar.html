 </head>
 
 <body>
<!--==============================
    SIDHUVUD OCH NAVIGATION
===============================-->
     <header>
         <nav aria-label="Huvudnavigation">
             <div class="logotyp">
                 <img src="../logotyp.jpg" alt="Svampletarnas logotyp">
             </div>
                 <ul id="huvudmeny">
                     <!--aria-current="page" berättar för skärmläsare att länken är den aktuella sidan-->
                     <li><a href="../Startsida/index.html">Startsida</a></li>
                     <li><a href="mina_svampar.html" aria-current="page">Mina svampar</a></li>

                 </ul>
         </nav>

<!--==============================
    SIDANS HUVUDINNEHÅLL
==============================-->
     <main>
         <section>
             <h1>Mina svampar</h1>
             <!-- Ljusgrön informationsruta -->
             <p class="green-section">
             <i aria-hidden="true" class="fa-solid fa-seedling"></i>
             Här hittar du alla dina svampar</p>
             <div class="mushroom-card" id="muschroom-list"></div>
             <!-- Behållaren gör att knappen och texten kan ligga bredvid
             varandra med hjälp av Flexbox -->
             <div class="clear">
                 <!-- Knappen rensar användarens svamplista -->
                 <button class="red" id="red.button" type="button">
                 <i aria-hidden="true" class="fa-solid fa-trash"></i>Rensa historik</button>
                 <!-- Varningstext bredvid knappen -->
                 <p class="warning-text">
                 <i aria-hidden="true" class="fa-solid fa-triangle-exclamation"></i>
                 <span>Varning!</span>Alla svampar tas bort.</p>
             </div>
         </section>
     </main>
